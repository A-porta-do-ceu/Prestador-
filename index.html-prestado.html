<style>
:root{--pk:#ff2e93;--pk2:#ff6db5;--pk3:#ffe3f1;--bg:#ffffff;--card:#fff6fb;--ink:#1b0c17;--ink2:#6b5563;--line:#f4dcea;--gr:#12b76a;--gr2:#0e9f5c;--red:#e5484d;--amb:#f59e0b;--shadow:0 12px 40px rgba(255,46,147,.18);

:root[data-theme="dark"]{--bg:#150911;--card:#22101c;--ink:#fff1f8;--ink2:#c9a9bc;--line:#3a1c30;--pk3:#3a1230}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;font-family:var(--f);background:#0d0509;color:var(--ink);overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.hide{display:none!important}
#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;background:var(--bg);overflow:hidden}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.scr.nonav{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.page{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 8px}
.row{display:flex;align-items:center}.g8{gap:8px}.g12{gap:12px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.mut{color:var(--ink2)}.big{font-size:20px;font-weight:800;letter-spacing:-.01em}small{font-size:12.5px}
h1,h2,h3{margin:0;letter-spacing:-.02em}h2{font-size:26px;line-height:1.12;font-weight:800}h3{font-size:19px;font-weight:800}
p{margin:6px 0}
.av{border-radius:50%;background:linear-gradient(135deg,var(--pk),var(--pk2));color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:18px;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,#ff2e93,#ff5fae);box-shadow:0 10px 26px rgba(255,46,147,.38);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.green{background:linear-gradient(135deg,#12b76a,#0e9f5c);box-shadow:0 10px 26px rgba(18,183,106,.4)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.btn.red{background:none;color:var(--red);box-shadow:none;border:1.5px solid var(--red)}
.btn.sm{height:42px;font-size:14.5px;border-radius:14px;width:auto;padding:0 16px}
.btn[disabled]{opacity:.5;pointer-events:none}
.splash{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,#ff2e93 0%,#b3125f 38%,#2a0c20 78%);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:calc(56px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px));overflow:auto}
.brand{text-align:center}.brand .logo{width:86px;height:86px;margin:0 auto 14px;border-radius:28px;background:#fff;display:grid;place-items:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.brand h1{font-size:44px;font-weight:800;letter-spacing:-.04em}.brand p{opacity:.92;font-size:16px}
.roles{display:grid;gap:12px;margin-top:28px}
.role{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;color:#fff;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);border-radius:22px;padding:14px 16px;transition:transform .12s}
.role:active{transform:scale(.98)}.role .ri{grid-row:1/3;font-size:32px;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.role b{font-size:18px}.role small{opacity:.85}.role.dim{opacity:.6}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.gps{font-size:12px;font-weight:700;padding:7px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.gps.ok{color:var(--gr2)}.gps.denied,.gps.off{color:var(--red)}.gps.wait{color:var(--amb)}
.hero h2{margin-bottom:14px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:0 14px;height:54px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;padding:12px 6px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;text-align:center;transition:transform .12s,border-color .12s}
.tile:active{transform:scale(.95);border-color:var(--pk)}.tile .te{font-size:31px;line-height:1}.tile .tn{font-size:12.5px;font-weight:700;line-height:1.2}
.live{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:16px;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,#ff2e93,#ff5fae);color:#fff;box-shadow:var(--shadow)}
.live b{display:block}.live .dot{width:10px;height:10px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--ink2);border-radius:14px}
.nav button span{font-size:22px;filter:grayscale(1);opacity:.7}.nav button.on{color:var(--pk)}.nav button.on span{filter:none;opacity:1}
.ov{position:absolute;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.ovh{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px}
.ovh .x{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px}
.ovb{flex:1;overflow:auto;padding:4px 16px 16px}
.ovf{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 14px;margin-bottom:10px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);transition:border-color .12s,background .12s}
.opt .ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:800;flex:none}
.opt.on{border-color:var(--pk);background:var(--pk3)}.opt.on .ck{background:var(--pk);border-color:var(--pk);color:#fff}
.opt b{font-weight:700}.opt .pr{font-weight:800;color:var(--pk);white-space:nowrap}
.sum{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:6px 16px}
.sum .l{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line)}.sum .l:last-child{border:0}
.total{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--gr2);text-align:center;margin:18px 0 6px}
.field{display:block;margin-bottom:14px}.field>span{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pk)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600}
.chip.on{background:var(--pk);border-color:var(--pk);color:#fff}
.avup{display:block;width:104px;height:104px;margin:6px auto 18px;position:relative;cursor:pointer}
.avup .av{width:104px;height:104px;font-size:38px;border:3px solid var(--pk3)}
.avup i{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--pk);color:#fff;display:grid;place-items:center;font-style:normal;border:3px solid var(--bg)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--pk3);color:var(--pk)}
.pill.g{background:rgba(18,183,106,.14);color:var(--gr2)}.pill.r{background:rgba(229,72,77,.14);color:var(--red)}.pill.a{background:rgba(245,158,11,.16);color:#b45309}
.mapbox{position:absolute;inset:0;background:#1a0b16}.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#mtop{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5}
#mtop>*{pointer-events:auto}
.fab{width:46px;height:46px;border-radius:50%;background:var(--bg);color:var(--ink);font-size:19px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.tag{display:flex;align-items:center;gap:8px;background:var(--bg);padding:8px 14px 8px 8px;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-weight:800;font-size:14px}
#mfab{position:absolute;left:0;right:0;top:calc(76px + env(safe-area-inset-top,0px));display:flex;justify-content:center;pointer-events:none;z-index:4}
.schip{background:rgba(27,12,23,.88);color:#fff;border:1px solid rgba(255,46,147,.6);padding:10px 18px;border-radius:99px;font-weight:800;font-size:15px;box-shadow:0 0 30px rgba(255,46,147,.5);backdrop-filter:blur(8px)}
.schip:after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
#panel{position:absolute;left:0;right:0;bottom:0;z-index:6}
#panel.nv{bottom:calc(62px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -16px 50px rgba(0,0,0,.4);animation:up .28s ease-out}
#panel.nv .sheet{border-radius:28px;margin:0 10px;padding-bottom:18px}
.sheet .btn{margin-top:12px}
.bar{height:5px;border-radius:9px;background:var(--pk3);overflow:hidden;margin:2px 0 14px}.bar:after{content:'';display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--pk),var(--pk2));border-radius:9px;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.acts{display:flex;gap:10px;margin-top:12px}.acts .btn{margin:0;flex:1}
.ib{position:relative;width:54px;height:54px;border-radius:18px;background:var(--pk3);font-size:22px;flex:none;display:grid;place-items:center}
.ib i{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:11px;font-style:normal;font-weight:800;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 5px}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.inc{position:absolute;inset:0;background:rgba(10,3,8,.66);z-index:50;display:flex;align-items:flex-end;backdrop-filter:blur(3px)}
.inc .sheet{width:100%;border-radius:30px 30px 0 0}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:conic-gradient(var(--pk) var(--p,100%),var(--pk3) 0)}
.ring b{width:52px;height:52px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.msgs{flex:1;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.35;word-wrap:break-word}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#ff2e93,#ff5fae);color:#fff;border-bottom-right-radius:6px}
.m.th{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.m small{display:block;opacity:.65;margin-top:3px;font-size:11px}
.cin{display:flex;gap:10px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.cin input{flex:1;padding:13px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);outline:0}
.cin button{width:50px;height:50px;border-radius:50%;background:var(--pk);color:#fff;font-size:20px}
.stars{display:flex;justify-content:center;gap:6px;margin:14px 0}.stars button{font-size:40px;filter:grayscale(1);opacity:.4}.stars button.on{filter:none;opacity:1}
#toast{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:center;z-index:99;pointer-events:none}
#toast div{background:#1b0c17;color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:88%;text-align:center;animation:up .2s ease-out;border:1px solid rgba(255,46,147,.5)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stat .card{margin:0}.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.tabs{display:flex;gap:8px;margin:0 0 14px}.tabs button{flex:1;padding:11px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:14px}.tabs button.on{background:var(--pk);color:#fff;border-color:var(--pk)}
details.cat{background:var(--card);border:1.5px solid var(--line);border-radius:18px;margin-bottom:10px;padding:0 14px}
details.cat summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 0;font-weight:700;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
.pin-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.pin-row input[type=number]{width:104px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);text-align:right;font-weight:700}
.empty{text-align:center;padding:40px 20px;color:var(--ink2)}.empty .e{font-size:46px}
.err{padding:30px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mbub{position:absolute;left:12px;right:12px;top:calc(70px + env(safe-area-inset-top,0px));z-index:45;display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1.5px solid var(--pk);border-radius:20px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.45);animation:mbin .25s ease-out;cursor:pointer}
@keyframes mbin{from{transform:translateY(-30px);opacity:0}}
.mbub .av{width:38px;height:38px;font-size:14px;flex:none}
.mbx{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--card);color:var(--ink2);font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.mbub .txt{flex:1;min-width:0;padding-right:24px}
.mbub b{display:block;font-size:13.5px}
.mbub p{margin:2px 0 0;font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapbox canvas{z-index:1}
#leafletmap{z-index:2;background:#1a0b16}
#leafletmap .leaflet-control-attribution{font-size:9px;opacity:.7}
.cfmov{position:absolute;inset:0;z-index:60;background:rgba(10,3,8,.66);display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);animation:mbin .15s ease-out}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>

  <div id="scr" class="scr"></div>

</div>

let realMapObj=null,realMapOk=false,realTileTimer=null,realMapPurpose=null;
function teardownRealMap(){
  clearTimeout(realTileTimer);
  if(realMapObj){try{realMapObj.remove();}catch(e){}}
  realMapObj=null;realMapOk=false;realMapPurpose=null;
  const el=document.getElementById('leafletmap');if(el){el.style.display='none';el.innerHTML='';}
  const cv=document.getElementById('cv');if(cv)cv.style.display='block';
}
function tryRealIdleMap(){
  const el=document.getElementById('leafletmap'),cv=document.getElementById('cv');
  if(!el||!cv)return;
  const coords=state.coords;
  if(!coords||typeof L==="undefined"){el.style.display='none';cv.style.display='block';return;}
  if(realMapPurpose!=='idle')teardownRealMap();
  if(!realMapObj){
    realMapPurpose='idle';
    try{
      realMapObj=L.map(el,{zoomControl:false,attributionControl:true}).setView([coords.lat,coords.lng],13);
      const tiles=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:20,subdomains:['a','b','c','d'],attribution:'© OpenStreetMap © CARTO'});
      let confirmed=false;
      tiles.on('tileload',()=>{
        if(!confirmed){
          confirmed=true;realMapOk=true;el.style.display='block';cv.style.display='none';cancelAnimationFrame(idleAnim);
          setTimeout(()=>{realMapObj.invalidateSize();realMapObj.flyTo([coords.lat,coords.lng],16,{duration:1.2});},60);
        }
      });
      tiles.addTo(realMapObj);
      clearTimeout(realTileTimer);
      realTileTimer=setTimeout(()=>{if(!confirmed){try{realMapObj.remove();}catch(e){}realMapObj=null;realMapOk=false;el.style.display='none';cv.style.display='block';}},3500);
      realMapObj._me=L.circleMarker([coords.lat,coords.lng],{radius:9,color:'#fff',weight:3,fillColor:state.online?'#12b76a':'#6b5563',fillOpacity:1}).addTo(realMapObj);
    }catch(e){realMapObj=null;realMapOk=false;el.style.display='none';cv.style.display='block';}
  }else if(realMapOk){
    realMapObj.setView([coords.lat,coords.lng]);
    if(realMapObj._me)realMapObj._me.setLatLng([coords.lat,coords.lng]).setStyle({fillColor:state.online?'#12b76a':'#6b5563'});
  }
}
function bindHomeTop(){
  document.querySelectorAll('#nav [data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
  const g=document.getElementById('btnGps');if(g)g.onclick=()=>{if(state.geo==="denied"||state.geo==="off"){toast("GPS indisponível neste ambiente — usando localização aproximada do seu endereço cadastrado");}retryGeo();};

let idleAnim=null;
function drawIdleMap(){
  if(realMapOk)return;
  const cv=document.getElementById('cv');if(!cv)return;
  cancelAnimationFrame(idleAnim);cancelAnimationFrame(mapAnim);
  const dpr=Math.min(2,window.devicePixelRatio||1);const w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const t0=Date.now();
  function frame(){
    if(!state.user||state.user.status!=="aprovado"||state.order||state.nav!=="home")return;
    const t=(Date.now()-t0)/1000;
    ctx.clearRect(0,0,w,h);
    const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"#2a0c20");g.addColorStop(1,"#0d0509");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    ctx.strokeStyle="rgba(255,120,180,.14)";ctx.lineWidth=1;const grid=42;const off=(t*9)%grid;
    for(let x=-grid+off;x<w+grid;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=-grid+off;y<h+grid;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    const cx=w/2,cy=h/2;
    if(state.online)for(let i=0;i<3;i++){const r=20+((t*36+i*35)%100);ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.strokeStyle=`rgba(18,183,106,${Math.max(0,.4-(r/100)*.4)})`;ctx.lineWidth=2;ctx.stroke();}
    ctx.save();ctx.translate(cx,cy);ctx.font="24px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fillStyle=state.online?"#12b76a":"#6b5563";ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();
    ctx.fillText(state.user.veic==="Moto"?"🛵":state.user.veic==="Carro"?"🚗":state.user.veic==="Utilitário"?"🚐":"🚶",0,1);ctx.restore();
    idleAnim=requestAnimationFrame(frame);
  }
  frame();
}

  state.incoming={cat,opt:opt[0],price,taxa,total:price+taxa,cliente,dist:(1+Math.random()*4).toFixed(1),expiresAt:Date.now()+18000};
  save();sndAlert();vib([0,300,100,300,100,300]);render();

  </div></div>`;
  const cdEl=document.getElementById('cdown');
  clearInterval(renderIncoming._i);
  renderIncoming._i=setInterval(()=>{
    const left=Math.max(0,Math.ceil((r.expiresAt-Date.now())/1000));
    if(cdEl)cdEl.textContent=left+"s";
    if(left<=0){clearInterval(renderIncoming._i);if(state.incoming){state.incoming=null;save();render();}}
  },400);
  document.getElementById('btnDecline').onclick=()=>{clearInterval(renderIncoming._i);sndTap();state.incoming=null;save();render();};
  document.getElementById('btnAccept').onclick=()=>{
    clearInterval(renderIncoming._i);sndSuccess();vib([10,30,10]);
    state.order={id:"PED"+Date.now(),cat:r.cat,opt:r.opt,total:r.total,cliente:r.cliente,status:"andamento",startedAt:Date.now(),eta:4+Math.floor(Math.random()*4)};
    state.chat=[{who:"me",txt:`Olá! Sou o(a) ${state.user.nome.split(" ")[0]}, já estou indo. Chego em ~${state.order.eta} min.`,t:Date.now()}];
    state.incoming=null;save();render();
  };
}

// ---------- Mapa / Corrida ----------
function renderMap(){
  const mtop=document.getElementById('mtop'),mfab=document.getElementById('mfab'),panel=document.getElementById('panel');
  mtop.innerHTML=`<button class="fab" id="mBack">←</button><div class="tag">🛠️ Chamô</div><button class="fab" id="mSound">🔔</button>`;
  document.getElementById('mBack').onclick=()=>{appConfirm("Cancelar este atendimento?",()=>{state.order=null;save();render();});};
  document.getElementById('mSound').onclick=()=>toast("Notificações ativas");
  mfab.innerHTML="";panel.className="nv";
  const o=state.order,c=o.cliente;
  panel.innerHTML=`<div class="sheet">
  <div class="row sp"><span class="pill g">🟢 A caminho • ${o.eta} min</span><span class="pill">${fmt(o.total)}</span></div>
  <div class="row g12" style="margin-top:12px"><span class="av" style="width:52px;height:52px">${esc(c.nome[0])}</span>
    <div class="grow"><b>${esc(c.nome)}</b><br><small class="mut">${o.cat.e} ${esc(o.cat.n)} — ${esc(o.opt)}</small><br><small class="mut">📍 ${esc(c.end)}</small></div>
    <div class="ib" id="btnCall">📞</div></div>
  <div class="acts">
    <button class="btn ghost sm" id="btnChat" style="flex:1">💬 Chat</button>
    <button class="btn red sm" id="btnCancel" style="flex:1">Cancelar</button>
    <button class="btn green sm" id="btnFinish" style="flex:1">Concluir</button>
  </div></div>`;
  document.getElementById('btnCall').onclick=()=>toast("Ligando para "+c.nome.split(" ")[0]+"…");
  document.getElementById('btnChat').onclick=openChat;
  document.getElementById('btnCancel').onclick=()=>{appConfirm("Cancelar atendimento?",()=>{state.order=null;save();render();});};
  document.getElementById('btnFinish').onclick=finishOrder;
  drawMap();
  tryRealOrderMap();
}
function tryRealOrderMap(){
  const el=document.getElementById('leafletmap'),cv=document.getElementById('cv');
  if(!el||!cv||!state.order)return;
  const coords=state.coords;
  if(!coords||typeof L==="undefined"){el.style.display='none';cv.style.display='block';return;}
  if(realMapPurpose!=='order')teardownRealMap();
  const seed=(state.order.id||"").split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  const cliLat=coords.lat+((seed%100)-50)/9000,cliLng=coords.lng+(((seed>>3)%100)-50)/9000;
  if(!realMapObj){
    realMapPurpose='order';
    try{
      realMapObj=L.map(el,{zoomControl:false,attributionControl:true}).setView([coords.lat,coords.lng],13);
      const tiles=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:20,subdomains:['a','b','c','d'],attribution:'© OpenStreetMap © CARTO'});
      let confirmed=false;
      tiles.on('tileload',()=>{
        if(!confirmed){
          confirmed=true;realMapOk=true;el.style.display='block';cv.style.display='none';cancelAnimationFrame(mapAnim);
          setTimeout(()=>{realMapObj.invalidateSize();realMapObj.flyTo([coords.lat,coords.lng],16,{duration:1.2});},60);
        }
      });
      tiles.addTo(realMapObj);
      clearTimeout(realTileTimer);
      realTileTimer=setTimeout(()=>{if(!confirmed){try{realMapObj.remove();}catch(e){}realMapObj=null;realMapOk=false;el.style.display='none';cv.style.display='block';}},3500);
      realMapObj._me=L.circleMarker([coords.lat,coords.lng],{radius:9,color:'#fff',weight:3,fillColor:'#12b76a',fillOpacity:1}).addTo(realMapObj);
      realMapObj._cli=L.marker([cliLat,cliLng]).addTo(realMapObj);
      realMapObj._line=L.polyline([[coords.lat,coords.lng],[cliLat,cliLng]],{color:'#ff2e93',weight:3,dashArray:'4,8'}).addTo(realMapObj);
    }catch(e){realMapObj=null;realMapOk=false;el.style.display='none';cv.style.display='block';}
  }else if(realMapOk&&realMapObj._me){
    realMapObj._me.setLatLng([coords.lat,coords.lng]);
  }
}
let mapAnim=null;
function drawMap(){
  if(realMapOk)return;
  const cv=document.getElementById('cv');const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  cancelAnimationFrame(mapAnim);cancelAnimationFrame(idleAnim);
  function frame(){
    if(!state.order)return;
    const t=Date.now()/1000;ctx.clearRect(0,0,w,h);
    const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"#2a0c20");g.addColorStop(1,"#0d0509");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    ctx.strokeStyle="rgba(255,120,180,.16)";ctx.lineWidth=1;const grid=42;const off=(t*10)%grid;
    for(let x=-grid+off;x<w+grid;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=-grid+off;y<h+grid;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    const cx=w/2,cy=h*0.75;const sx=w*0.5,sy=h*0.2;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(cx,cy);ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=3;ctx.setLineDash([2,7]);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(cx,cy,9,0,7);ctx.fillStyle="#ff2e93";ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();
    const prog=Math.min(1,(Date.now()-state.order.startedAt)/((state.order.eta||5)*60000));
    const px=sx+(cx-sx)*prog,py=sy+(cy-sy)*prog;
    ctx.save();ctx.translate(px,py);ctx.font="26px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fillStyle="#151020";ctx.fill();ctx.fillText("🛵",0,1);ctx.restore();
    mapAnim=requestAnimationFrame(frame);
  }
  frame();
}

// ---------- Chat ----------
function openChat(){
  const o=state.order,c=o.cliente;const v=document.getElementById('chatv');
  const paint=()=>{v.innerHTML=`<div class="ov"><div class="ovh"><button class="x" id="cx">←</button>
    <span class="av" style="width:40px;height:40px">${esc(c.nome[0])}</span>
    <div class="grow"><b>${esc(c.nome)}</b><br><small class="mut">cliente</small></div></div>
    <div class="msgs" id="msgs">${state.chat.map(m=>`<div class="m ${m.who==='me'?'me':'th'}">${esc(m.txt)}<small>${new Date(m.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join("")}</div>
    <div class="cin"><input id="cInput" placeholder="Digite uma mensagem…"><button id="cSend">➤</button></div></div>`;
    document.getElementById('cx').onclick=()=>{v.innerHTML="";};
    const msgs=document.getElementById('msgs');msgs.scrollTop=msgs.scrollHeight;
    document.getElementById('cSend').onclick=sendMsg;document.getElementById('cInput').onkeydown=(e)=>{if(e.key==="Enter")sendMsg();};
  };
  function sendMsg(){const inp=document.getElementById('cInput');const t=inp.value.trim();if(!t)return;
    state.chat.push({who:"me",txt:t,t:Date.now()});inp.value="";save();sndTap();paint();
    setTimeout(()=>{const reps=["Ok, te espero!","Combinado 👍","Certo, obrigado(a).","Perfeito!"];
      const txt=reps[Math.floor(Math.random()*reps.length)];
      state.chat.push({who:"cli",txt,t:Date.now()});save();sndMsg();vib(15);
      if(document.getElementById('msgs'))paint();
      else showMsgBubble(c.nome,txt,esc(c.nome[0]),openChat);
    },1300+Math.random()*1200);}
  paint();
}
function showMsgBubble(name,txt,avatarHtml,onTap){
  const cc=document.getElementById('msgbubble');if(!cc)return;
  const id="mb"+Date.now();
  cc.innerHTML=`<div class="mbub" id="${id}"><span class="av">${avatarHtml}</span><div class="txt"><b>${esc(name)}</b><p>${esc(txt)}</p></div><button class="mbx" id="${id}x">✕</button></div>`;
  const el=document.getElementById(id);
  document.getElementById(id+"x").onclick=(e)=>{e.stopPropagation();cc.innerHTML="";};
  el.querySelector('.txt').onclick=()=>{cc.innerHTML="";if(onTap)onTap();};
}

// ---------- Concluir / Ganhos / Perfil ----------
function finishOrder(){
  vib([10,20,10]);sndSuccess();const o=state.order;
  state.history.unshift({...o,fim:Date.now()});
  state.user.corridas=(state.user.corridas||0)+1;
  localStorage.setItem(LS_KEY+"_lastuser",JSON.stringify(state.user));
  state.order=null;save();toast("Atendimento concluído! "+fmt(o.total)+" adicionados aos seus ganhos.");render();
}
function screenGanhos(){
  const total=state.history.reduce((s,o)=>s+o.total,0);
  return `<div class="page"><h2>Ganhos</h2>
  <div class="stat"><div class="card"><small class="mut">Total acumulado</small><b>${fmt(total)}</b></div><div class="card"><small class="mut">Atendimentos</small><b>${state.history.length}</b></div></div>
  ${state.history.length?state.history.map(o=>`<div class="card"><div class="row sp"><b>${o.cat.e} ${esc(o.cat.n)}</b><span class="pill g">${fmt(o.total)}</span></div>
    <small class="mut">${esc(o.cliente.nome)} • ${new Date(o.fim).toLocaleDateString('pt-BR')}</small></div>`).join(""):`<div class="empty"><div class="e">💰</div>Nenhum atendimento concluído ainda.</div>`}
  </div>`;
}
function screenPerfil(){
  const u=state.user;
  return `<div class="page"><h2>Perfil</h2>
  <div class="card row g12">
    <label class="av" style="width:60px;height:60px;font-size:22px;cursor:pointer" id="chAv">${u.foto?`<img src="${u.foto}">`:esc(u.nome[0])}</label>
    <input type="file" id="fAvEdit" accept="image/*" style="display:none">
    <div class="grow"><b>${esc(u.nome)}</b><br><small class="mut">⭐ ${u.nota.toFixed(1)} • ${u.corridas} atendimentos</small></div>
    <span class="pill ${u.status==='aprovado'?'g':'a'}">${esc(u.status)}</span>
  </div>
  <h3>Dados</h3>
  <div class="card"><small class="mut">Contato</small><br>${esc(u.tel||"")} ${u.email?"• "+esc(u.email):""}<br>
  <small class="mut">Veículo</small><br>${esc(u.veic)} ${u.placa?"• "+esc(u.placa):""}</div>
  <h3>Serviços prestados</h3>
  <div class="chips">${u.cats.map(k=>{const c=CATS.find(x=>x.k===k);return `<span class="chip on">${c?c.e+" "+esc(c.n):k}</span>`;}).join("")}</div>
  <button class="btn red" id="btnLogout" style="margin-top:16px">Sair da conta</button>
  </div>`;
}
function bindPerfil(){
  document.getElementById('chAv').onclick=()=>document.getElementById('fAvEdit').click();
  document.getElementById('fAvEdit').onchange=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.user.foto=r.result;localStorage.setItem(LS_KEY+"_lastuser",JSON.stringify(state.user));save();render();};r.readAsDataURL(f);};
  document.getElementById('btnLogout').onclick=()=>{appConfirm("Sair da conta?",()=>{state.online=false;state.user=null;save();render();});};
}

render();
</script>
